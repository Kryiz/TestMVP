      const navByRole = {

          ['triangle-alert', 'Рекламации', 'claims', 7],
          ['truck', 'Доставка', 'shipments', 9],

      function getRegistryMeta(section) {
        const common = {

          receiver: {
            orders: ['Договоры для планирования приёмки', 'Заключённые договоры разных поставщиков, сроки и условия будущей приёмки.', '14 договоров'],

        const drawerButton = event.target.closest('[data-drawer]');
        const resolutionButton = event.target.closest('[data-resolution]');

        const offerSourceButton = event.target.closest('[data-offer-source]');
        const createRequestButton = event.target.closest('[data-create-request]');
        const createOfferButton = event.target.closest('[data-create-offer]');

        const addClaimButton = event.target.closest('[data-add-claim]');

        const backRegistryButton = event.target.closest('#sp-back-registry');
        if (roleButton) { state.role = roleButton.dataset.role; state.view = 'dashboard'; state.section = 'dashboard'; state.drawer = null; render(); }
        if (stepButton) { state.step = Number(stepButton.dataset.step); state.section = steps[state.step].section; state.view = 'process'; state.drawer = null; render(); }
        if (navButton) {
          const section = navButton.dataset.navSection;
          state.drawer = null;
          state.section = section;
          if (section === 'dashboard') state.view = 'dashboard';

          render();

        if (drawerButton) { state.drawer = state.drawer === drawerButton.dataset.drawer ? null : drawerButton.dataset.drawer; renderDrawer(); }
        if (resolutionButton) { state.resolution = resolutionButton.dataset.resolution; render(); }
        if (requestSourceButton) { state.requestSource = requestSourceButton.dataset.requestSource; render(); }

        if (createRequestButton) { state.step = 1; state.section = 'requests'; state.requestSource = 'manual'; state.creatingRequest = true; state.view = 'process'; state.drawer = null; render(); }
        if (createOfferButton) { state.step = 2; state.section = 'offers'; state.offerSource = 'request'; state.creatingOffer = true; state.view = 'process'; state.drawer = null; render(); }
        if (addContractButton) { state.step = 4; state.section = 'orders'; state.creatingContract = true; state.view = 'process'; state.drawer = null; render(); }
        if (addClaimButton) { state.role = 'receiver'; state.step = 7; state.section = 'claims'; state.creatingClaim = true; state.view = 'process'; state.drawer = null; render(); }
        if (productButton) { state.product = productButton.dataset.openProduct; state.section = 'catalog'; state.view = 'product'; state.drawer = null; render(); }
        if (productToRequestButton) { state.step = 1; state.section = 'requests'; state.requestSource = 'catalog'; state.creatingRequest = true; state.view = 'process'; state.drawer = null; render(); }
        if (assetButton) { state.view = 'asset'; state.drawer = null; render(); }
        if (backRegistryButton) { state.view = state.section === 'catalog' ? 'catalog' : 'registry'; state.creatingRequest = false; state.creatingOffer = false; state.creatingContract = false; state.creatingClaim = false; state.drawer = null; render(); }
      });
      root.querySelector('#sp-prev').addEventListener('click', () => { if (state.step > 0) { state.step -= 1; state.section = steps[state.step].section; state.view = 'process'; state.drawer = null; render(); } });
      root.querySelector('#sp-next').addEventListener('click', () => { if (state.step < steps.length - 1) { state.step += 1; state.section = steps[state.step].section; state.view = 'process'; state.drawer = null; render(); } });

      render();
    })();
  </script>
</div>
